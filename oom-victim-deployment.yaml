apiVersion: v1
kind: Namespace
metadata:
  name: aiops-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oom-victim
  namespace: aiops-demo
  labels:
    app: oom-victim
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oom-victim
  template:
    metadata:
      labels:
        app: oom-victim
    spec:
      containers:
        - name: oom-victim
          image: polinux/stress:latest
          command:
            - stress
            - --vm
            - "1"
            - --vm-bytes
            - 64M
            - --vm-hang
            - "0"
          resources:
            requests:
              cpu: 25m
              memory: 16Mi
            limits:
              cpu: 250m
              memory: 32Mi
