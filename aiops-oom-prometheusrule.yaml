apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: aiops-oom-alert
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: aiops-demo.rules
      rules:
        - alert: KubernetesPodOOMKilled
          expr: kube_pod_container_status_last_terminated_reason{reason="OOMKilled", namespace="aiops-demo"} == 1
          for: 30s
          labels:
            severity: critical
          annotations:
            summary: "Pod was OOMKilled"
            description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} was OOMKilled."